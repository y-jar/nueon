[package]
name = "nueon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core data model, storage, configuration, and version control for nueon."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flo_curves = "0.8"
write-fonts = "0.54"
read-fonts = "0.45"
kurbo = "0.13"

[dev-dependencies]
harfrust = "0.14.0"
tempfile = "3"
