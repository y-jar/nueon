[package]
name = "langloom-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core data model, storage, configuration, and version control for langloom."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
