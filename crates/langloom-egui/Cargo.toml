[package]
name = "langloom-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Legacy egui UI for langloom (temporary reference during the Tauri migration)."

[[bin]]
name = "langloom"
path = "src/main.rs"

[dependencies]
anyhow = "1"
egui = "0.36"
egui_extras = "0.36"
egui_dock = "0.21"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
pulldown-cmark = "0.13"
rfd = "0.17"
uuid = { version = "1", features = ["v4", "serde"] }
langloom-core = { path = "../langloom-core" }

[dev-dependencies]
tempfile = "3"
