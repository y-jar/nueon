[package]
name = "langjar"
version = "0.1.0"
edition = "2021"
description = "A super awesome conlang editor and creation app."
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

# UI stack, enabled when the GUI phase begins:
# eframe = "0.36"
# egui = "0.36"
# egui_extras = "0.36"
