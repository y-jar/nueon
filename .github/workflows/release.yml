# Release
#
# Build the Linux bundles (AppImage, deb, rpm) and publish them to a GitHub
# Release whenever a v* tag is pushed. The release is created as a draft;
# publish it from the Releases page once the assets look right. See
# docs/RELEASING.md for the full flow.
#
# A single ubuntu-22.04 runner is used so the artifacts carry the widest glibc
# baseline (2.35) and there is no asset-name collision between jobs.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version.sh compares against v* tags, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file \
            patchelf rpm

      - name: Check version
        run: sh scripts/check-version.sh "${{ github.ref_name }}"

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "nueon ${{ github.ref_name }}"
          releaseBody: |
            Linux packages (.AppImage, .deb, .rpm).

            Install a package, or run the portable AppImage:

            - **Debian / Ubuntu** — `sudo apt install ./nueon_*.deb`
            - **Fedora / openSUSE** — `sudo dnf install ./nueon-*.rpm`
            - **Portable** — `chmod +x nueon_*.AppImage && ./nueon_*.AppImage`
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb,rpm
