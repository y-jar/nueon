# CI — mirrors the `loom-gates` command in shell.nix. Keep the two in sync;
# the canonical command list lives in AGENTS.md ("Gates").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version.sh compares against v* tags, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file \
            patchelf rpm \
            imagemagick

      # NOTE: the WebDriver probes (probes/probe.mjs) are NOT run here — they
      # need tauri-driver, WebKitWebDriver and Xvfb (see docs/PROBING.md).
      # `nix build .#` is intentionally not run yet; consider a later job.

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run check
      - run: npm run test
      - run: sh scripts/check-icons.sh
      - run: sh scripts/test-version.sh
      - run: sh scripts/check-version.sh
