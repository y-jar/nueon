[package]
name = "langloom-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop shell for langloom."

[lib]
name = "langloom_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "langloom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
langloom-core = { path = "../crates/langloom-core" }

[features]
# Production builds embed the built frontend and skip the dev-server URL.
# Enabled by the Nix package (see flake.nix); the Tauri CLI sets it for `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
