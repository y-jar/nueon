[package]
name = "nueon-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop shell for nueon."

[lib]
name = "nueon_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nueon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
nueon-core = { path = "../crates/nueon-core" }

[features]
# Production builds embed the built frontend and skip the dev-server URL.
# Enabled by the Nix package (see flake.nix); the Tauri CLI sets it for `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

# Silent print-to-PDF (see commands/export.rs). Both crates are already pulled
# in by wry; naming them lets us drive WebKitGTK's PrintOperation directly.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
